name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Spotless is bound to the validate phase, so format drift fails here too.
      #
      # The tests start PostgreSQL, Redis and Valkey through Testcontainers. The
      # ubuntu-latest runner ships a Docker daemon, so there is no service block: a
      # service block would pin versions in two places and let them disagree.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Kept for the run that fails: a Testcontainers failure says almost nothing
      # without the report beside it, and the alternative is asking somebody to
      # reproduce a flake on their own machine.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  optional-engines:
    name: The engines that are not in the default build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # TiKV's sources live under src/tikv and are compiled only by its profile, so nothing
      # in the ordinary build would notice them breaking — a rename in an interface they
      # implement, a method they call that goes away. This compiles them and runs their own
      # tests, which is the cheap half of what the profile does.
      #
      # Not the whole suite. Everything else it would run is already run above, and the
      # difference between the two builds is these three classes and the class-loading
      # arrangement the profile turns on.
      - name: Compile the TiKV engine and run its tests
        run: ./mvnw -B -ntp -Ptikv test -Dtest='Tikv*' -DfailIfNoSpecifiedTests=true
