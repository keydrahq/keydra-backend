# ---------------------------------------------------------------------------
# Keydra backend configuration
# Profiles: %dev (quarkus:dev), %test (surefire), %prod (packaged runtime)
# ---------------------------------------------------------------------------

quarkus.application.name=keydra
quarkus.banner.enabled=false

# ---- HTTP ----
quarkus.http.port=8181

quarkus.http.enable-compression=true

quarkus.http.compress-media-types=application/json,application/graphql-response+json,text/html,text/plain,text/css,text/javascript,application/javascript,image/svg+xml

# ---- What the browser is told to enforce ----
# Headers rather than code, because every one of these is a rule the browser applies
# and the server only states. They are written out here so the set can be read in one
# place: a missing header is not visible from any single resource.
#
# The policy is a property rather than a literal so a deployment that sends telemetry
# somewhere, or serves the assets from a CDN, can widen exactly the directive it needs
# instead of turning the header off. Widening one directive means restating them all,
# which is the point — a policy is a whole or it is nothing.
keydra.http.content-security-policy=${KEYDRA_CSP:default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'}
quarkus.http.header."Content-Security-Policy".value=${keydra.http.content-security-policy}
quarkus.http.header."Content-Security-Policy".path=/*

# Nothing here is ever a document the browser should guess the type of. Without this a
# response Keydra labels as JSON can still be sniffed into a script by an older browser,
# which is how a stored value becomes executable.
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Content-Type-Options".path=/*

# Said twice on purpose: frame-ancestors above is the modern rule and this is the one
# older browsers read. Keydra draws a console that runs commands against somebody's
# server — a page that could frame it could steer a click into one.
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Frame-Options".path=/*

# A key name, a glob and a channel all live in the address bar here, and a Referer header
# carries the address to whoever is linked to. Origin-only when leaving this site.
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Referrer-Policy".path=/*

# None of these are things a management console needs, and a policy that says so is what
# stops something embedded from asking on its behalf.
quarkus.http.header."Permissions-Policy".value=accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()
quarkus.http.header."Permissions-Policy".path=/*

# Answers under /api are about one caller and are never the same for two of them. Without
# this a proxy in front of Keydra may hold one person's answer and hand it to the next.
quarkus.http.header."Cache-Control".value=no-store
quarkus.http.header."Cache-Control".path=/api/*

# Only in production, and only because a browser that is told this once will refuse plain
# HTTP to the host for a year — which is right for a deployment and wrong for a laptop,
# where it would pin localhost to a certificate nobody has.
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
%prod.quarkus.http.header."Strict-Transport-Security".path=/*

# The API documentation and the schema explorer are served by libraries that inline their
# own scripts and styles, so the dev profile states a policy loose enough to run them. It
# is not the production policy relaxed — it is a different policy, for a surface that does
# not exist in production.
%dev.keydra.http.content-security-policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: http://localhost:8181 ws://localhost:8181; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'

# ---- What a request may weigh ----
# Set rather than left at their defaults for the same reason the GraphQL limits below are:
# an unbounded request is a way of spending the server's memory without authenticating.
# The body allowance is the one a key import and a backup upload have to fit inside, so it
# is a property — the others have no legitimate large case.
quarkus.http.limits.max-body-size=${KEYDRA_MAX_BODY_SIZE:25M}
quarkus.http.limits.max-header-size=8K
quarkus.http.limits.max-initial-line-length=4096


# ---- OpenAPI ----
quarkus.smallrye-openapi.path=/api/openapi
# In production the document moves to the management port rather than being switched off.
#
# It is a description of every door this application has, which is the same kind of thing the
# metrics are: useful to somebody building against it, and a map to somebody who holds nothing.
# So it goes where the other descriptions of the installation went, and the port the proxy
# publishes carries only what a browser needs.
#
# Moved rather than disabled, and that is not a preference. Turning it off is a *build-time*
# switch, and setting one made the shaded-Guava boot race that phases 55, 56 and 59 recorded
# go from about one boot in ten to every boot: what is generated into ApplicationImpl's static
# initialiser depends on build-time configuration, which is exactly where phase 59 located the
# race. Worth knowing before changing any other build-time property here.
%prod.quarkus.smallrye-openapi.management.enabled=true
quarkus.smallrye-openapi.info-title=Keydra API
quarkus.smallrye-openapi.info-description=Web-based Redis/Valkey management console
quarkus.smallrye-openapi.info-version=v1
# Adds x-logo to the document; Swagger UI itself is branded by META-INF/branding/
mp.openapi.filter=io.keydra.common.openapi.OpenApiBranding

# ---- Redis ----
# The extension ships with Dev Services, which would start a throwaway Redis
# container on every dev/test run. Keydra never uses a statically configured
# client: connections are opened per profile through the ConnectionRegistry
# (phase 1), so Dev Services is off everywhere.
quarkus.devservices.enabled=false


# ---- Credential encryption ----
# Stored target passwords are AES-256-GCM encrypted at rest. Dev and test use a
# fixed secret so fixtures are reproducible; prod has no default, so the app
# refuses to start without KEYDRA_SECRET_KEY rather than silently using a weak key.
%dev.keydra.crypto.secret=keydra-dev-secret-do-not-use-in-production
%test.keydra.crypto.secret=keydra-test-secret
%prod.keydra.crypto.secret=${KEYDRA_SECRET_KEY}

# ---- Connections ----
quarkus.hibernate-validator.fail-fast=false
keydra.connections.health-check-interval=10s

# ---- Datasource ----
# Fully reactive: Hibernate Reactive over the Vert.x PostgreSQL client. There is
# no reactive H2 driver, so dev and test use a throwaway PostgreSQL container via
# Dev Services rather than an in-process database. That also removes the old
# dev/prod dialect split.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.reactive.url=${KEYDRA_DB_URL:postgresql://localhost:5432/keydra}
%prod.quarkus.datasource.username=${KEYDRA_DB_USERNAME:keydra}
%prod.quarkus.datasource.password=${KEYDRA_DB_PASSWORD:}

# Dev points at the PostgreSQL container in deploy/keydra-dev.yaml, so the
# database is managed the same way as the Redis and Valkey targets instead of
# appearing implicitly. Tests get their own container from PostgresResource.
%dev.quarkus.datasource.reactive.url=postgresql://localhost:5442/keydra
%dev.quarkus.datasource.username=keydra
%dev.quarkus.datasource.password=keydra

# Schema is generated by Hibernate while the model is small; Flyway migrations
# arrive with production packaging (roadmap phase 8).
# Dev updates rather than recreates, so saved connection profiles survive the
# restarts that live reload causes. Tests always start from an empty schema.
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=validate


# ---- Dev conveniences ----
# The Vite dev server runs on :9000 and proxies /api, but direct browser calls
# during debugging need CORS. Never enabled outside the dev profile.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:9000
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.log.category."io.keydra".level=DEBUG

# --- Security -----------------------------------------------------------------
# Enforcement is on unless configuration says otherwise, and only the dev profile
# says otherwise. A deployment that forgets to configure security therefore gets
# security rather than an open door.
keydra.security.enabled=${KEYDRA_SECURITY_ENABLED:true}

# Dev enforces too, now that Keydra has accounts of its own: an instance with no
# users offers to create its first administrator, so bringing security up in dev no
# longer means standing up an identity provider first. Set KEYDRA_SECURITY_ENABLED
# to false to go back to an open instance.
%dev.keydra.security.enabled=${KEYDRA_SECURITY_ENABLED:true}
%dev.quarkus.oidc.enabled=false

# A development instance with no accounts gets one, so that enforcement being on in dev does
# not mean clicking through first-run setup after every fresh database. Only the dev profile
# sets these, and DevAdministratorSeeder does nothing without them — there is no value for a
# production instance to fall back to, which is the point. It also runs only when there are no
# accounts at all, so it never resets a password somebody has changed.
%dev.keydra.security.dev-administrator.username=admin
%dev.keydra.security.dev-administrator.password=admin

# --- Signing in ---------------------------------------------------------------
# Form authentication, wired to paths under /api/v1/auth so the whole API is one
# prefix. Quarkus checks the password and issues the session cookie itself: a
# cookie that carries an identity has to be signed and encrypted, and that is not
# a thing to hand-roll.
#
# The three page properties are deliberately empty. Their defaults redirect a
# browser to an HTML login page, which is right for a server-rendered application
# and wrong for this one — the frontend is a single page that needs a 401 it can
# act on, not a redirect it has to detect.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.post-location=/api/v1/auth/login
quarkus.http.auth.form.username-parameter=username
quarkus.http.auth.form.password-parameter=password
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
# Signing out is an endpoint of this application's own rather than a configured path:
# this Quarkus offers logout as a call, not as a route, and a property naming a path it
# does not read would have looked configured while doing nothing at all.
quarkus.http.auth.form.cookie-name=keydra_session
# Eight hours, renewed every half hour of use: long enough to be a working day,
# short enough that a forgotten session is not a standing one.
quarkus.http.auth.form.timeout=8H
quarkus.http.auth.form.new-cookie-interval=30M
quarkus.http.auth.form.http-only-cookie=true
# Secure by default, and off only where there is no TLS to be secure about.
#
# Derived from configuration rather than from whether this particular request arrived over
# TLS, which is what the code used to ask. Behind a proxy that terminates TLS — the normal
# way to run this — the request reaching Keydra is plain HTTP, so asking the request would
# have quietly dropped the flag on exactly the deployments that need it. Sessions reads the
# same property for keydra_sid, so the two cookies that make up one session cannot disagree.
keydra.security.cookie-secure=${KEYDRA_COOKIE_SECURE:true}
%dev.keydra.security.cookie-secure=false
%test.keydra.security.cookie-secure=false
# Quarkus has no such setting: its form authentication decides Secure from whether the
# request arrived over TLS, which behind a proxy that terminates it is false. So the flag is
# added to that cookie on the way out — see common.vertx.SecureSessionCookie — and Sessions
# reads the same property for keydra_sid, which it issues itself.
# Lax rather than the default Strict. A sign-in through an external provider ends
# with that provider navigating the browser back here, and a Strict cookie is not
# sent on a navigation that started somewhere else — the session would be issued
# and then not presented, which looks exactly like a sign-in that failed. Lax
# still withholds the cookie from cross-site form posts, which is what stops a
# page elsewhere from acting as somebody who is signed in here.
quarkus.http.auth.form.cookie-same-site=Lax
# Written out rather than left to a default because SessionIssuer reads the same
# properties to build the same cookie for a provider sign-in: FormAuthConfig is
# not a bean and cannot be injected, so the two readers agree only while there is
# nothing for them to disagree about.
quarkus.http.auth.form.cookie-path=/

# ---- Behind a proxy ----
# Off by default, because turning it on means believing X-Forwarded-For — and a header is
# only worth believing when something in front of Keydra is guaranteed to overwrite it. A
# deployment that terminates TLS elsewhere sets both of these together: the switch, and the
# list of proxies whose word is taken. With the switch on and the list empty, anybody can
# claim any address, which is worse than not asking.
#
# It matters for more than logging: the address a sign-in came from is what the anomaly
# checks compare against, and every request appearing to come from the proxy would make a
# fleet of people look like one very busy one.
quarkus.http.proxy.proxy-address-forwarding=${KEYDRA_BEHIND_PROXY:false}
quarkus.http.proxy.enable-forwarded-host=${KEYDRA_BEHIND_PROXY:false}
quarkus.http.proxy.trusted-proxies=${KEYDRA_TRUSTED_PROXIES:}
# The same secret that encrypts stored target passwords. One secret to configure
# rather than two, and losing it already means re-entering every credential — so
# also invalidating every session is not a new failure mode.
quarkus.http.auth.session.encryption-key=${keydra.crypto.secret}

# --- Rotating that secret ------------------------------------------------------
# Keys that only read. A rotation is: add the new secret as keydra.crypto.secret,
# move the old one here, restart, ask /api/v1/security/encryption/rotate to move
# everything, then take this away and restart again. The last restart is the proof —
# anything missed would no longer decrypt.
#
# Every encrypted value names the key that wrote it, which is what makes more than
# one readable at once and therefore what makes a rotation something other than an
# outage.
%prod.keydra.crypto.previous-secrets=${KEYDRA_PREVIOUS_SECRET_KEYS:}

# --- Where a browser reaches this instance ------------------------------------
# Only needed where it differs from what the request says, which is wherever
# something sits in front: a reverse proxy terminating TLS on another host, or
# in development the Vite server on :9000 forwarding /api here. It matters
# because a redirect URI is agreed with an identity provider in advance and has
# to match to the character.
keydra.public-url=${KEYDRA_PUBLIC_URL:}
%dev.keydra.public-url=http://localhost:9000
# Whether an unconfigured address may be worked out from the request instead.
#
# Only in development, where the answer is always localhost and nobody is being sent
# anywhere. Everywhere else the Host header is written by whoever sent the request, so a
# redirect URI derived from it is a destination the sender chose — and the one place that
# lands is the end of a sign-in, after the password has already been given. Off means the
# operations that publish an address say they are not configured, rather than publishing
# one somebody else picked.
keydra.public-url-from-request=false
%dev.keydra.public-url-from-request=true
%test.keydra.public-url-from-request=true

# ---- Sign-in: what is refused, what is noticed, what is kept ----
# A password form with no limit accepts guesses for as long as somebody cares to make
# them. Worse, the thing that makes each guess expensive for them — Argon2 at 19 MiB —
# makes it exactly as expensive for the server, so unlimited attempts is also a way of
# spending Keydra's memory without authenticating. The limit is answered before the hash.
keydra.security.sign-in.throttle-enabled=${KEYDRA_SIGN_IN_THROTTLE:true}
# Rolling, not a run of consecutive failures: a run resets on any success, which is a thing
# an attacker working from a list can arrange.
keydra.security.sign-in.window=PT15M
# Two limits because the two attacks look nothing alike. Guessing one person's password is
# many attempts against one name; working through a bought list is one attempt against each
# of many names, and a per-account limit never sees it.
keydra.security.sign-in.max-failures-per-account=8
keydra.security.sign-in.max-failures-per-network=40

# What makes a sign-in that worked worth mentioning. All of these describe a correct
# password — which is what a stolen one also is.
keydra.security.sign-in.suspicious-failures-before=5
keydra.security.sign-in.suspicious-volume=50
keydra.security.sign-in.suspicious-accounts=5
keydra.security.sign-in.dormant-after=P60D
# Generous on purpose: long enough that a flight is never flagged, short enough that two
# continents twenty minutes apart always is.
keydra.security.sign-in.travel-allowance=PT2H
# How long the attempt history is kept. Long enough to see a slow attack, short enough that
# it is not a standing record of where people have been.
keydra.security.sign-in.retention=P90D

# A file, not a service. Placing an address in a country needs a database, and asking a
# third party for it on every sign-in would mean telling them who signs in here and from
# where. Unset, sign-ins are still compared on network and browser — what is lost is the two
# checks that need a map.
keydra.security.geoip-database=${KEYDRA_GEOIP_DATABASE:}

# ---- Sockets ----
# A WebSocket handshake is not covered by the same-origin policy the way a fetch is: any
# page can open one to this instance, and the browser attaches this origin's cookies while
# it does. One of the three sockets here runs commands against somebody's server. SameSite
# already withholds the cookie in a current browser; this is the rule rather than the
# mitigation, and it is off only where somebody has a reason.
keydra.security.socket-origin-check=${KEYDRA_SOCKET_ORIGIN_CHECK:true}
# For a deployment that serves the interface from somewhere other than the API. Comma
# separated, scheme and host — "https://keydra.example", not a path.
keydra.security.socket-origins=${KEYDRA_SOCKET_ORIGINS:}
# The dev server is a different origin than the backend by construction, and the browser
# talking to it is the one that opens the sockets.
%dev.keydra.security.socket-origins=http://localhost:9000,http://localhost:8181

# ---- Where Keydra will make a request to ----
# Several things take a URL from a form and fetch it: a webhook an alert posts to, an identity
# provider's issuer, an object store's endpoint. Each is a request made by the server, from
# inside the server's network. On every large cloud the most valuable address to aim one at is
# 169.254.169.254, which answers unauthenticated with the machine's credentials — and
# configuring an alert is an operator's to do, not an administrator's. Link-local is refused
# outright and has no setting, because nothing legitimate posts an alert to a metadata service.
#
# Loopback off and private on, that way round on purpose: a receiver running beside Keydra is a
# real arrangement and a self-hosted chat server on a private address is the ordinary case for
# a webhook. A default that refused the ordinary case would be turned off on the first day.
keydra.egress.allow-loopback=${KEYDRA_EGRESS_ALLOW_LOOPBACK:false}
keydra.egress.allow-private=${KEYDRA_EGRESS_ALLOW_PRIVATE:true}
# Named hosts skip the address checks entirely, for the one internal receiver a deployment has.
keydra.egress.allowed-hosts=${KEYDRA_EGRESS_ALLOWED_HOSTS:}
# Development posts to whatever is running on the laptop.
%dev.keydra.egress.allow-loopback=true
%test.keydra.egress.allow-loopback=true

# Off for the test suite at large, and switched on by the one test class that is
# about authorisation (see SecuredProfile). A test about what the key browser does
# should not have to authenticate to say it; a test about who may use it must.
# Identities there come from @TestSecurity rather than a container: the role matrix
# is what is under test, not somebody else's token validation.
%test.keydra.security.enabled=false
%test.quarkus.oidc.enabled=false

# Production authenticates against an OIDC provider. Roles come from the token;
# which claim carries them varies by provider, hence the explicit path.
#
# OIDC used to follow the enforcement switch, on the grounds that they were one decision: a
# deployment not checking who you are has no use for a provider, and one that is has no use
# without it. Half of that stopped being true at phase 22, which gave Keydra accounts of its
# own — passwords it hashes, sessions it issues, second factors, invitations. Checking who
# somebody is no longer requires an issuer anywhere.
#
# What the coupling did was refuse to start: enforcement on with no provider named leaves the
# tenant enabled with no issuer, and the process dies on "'quarkus.oidc.auth-server-url'
# property must be configured" — a message about a property nobody set, on a deployment that
# wanted local accounts. Enforcement is on by default, so that was the shipped default failing
# to boot.
#
# The tenant now follows the only thing that decides it: whether an issuer has been named. That
# is computed in io.keydra.common.config.IdentityProviderPresent rather than read from a second
# variable here, because a second variable is the same fact said twice and the failure mode is
# somebody setting one of them.
%prod.quarkus.oidc.enabled=true
# tenant-enabled rather than enabled: the latter is a build-time property, baked into the
# image, so an environment variable could not turn it off in a container that was already
# built. This one is read at startup, which is where the decision has to be made — and it is
# left unset here so the config source above supplies it, with an explicit
# QUARKUS_OIDC_TENANT_ENABLED still winning over both.
%prod.quarkus.oidc.auth-server-url=${KEYDRA_OIDC_URL:}
%prod.quarkus.oidc.client-id=${KEYDRA_OIDC_CLIENT_ID:keydra}
%prod.quarkus.oidc.credentials.secret=${KEYDRA_OIDC_SECRET:}
# web-app rather than service: Quarkus then performs the authorization-code flow itself
# and keeps the session in a cookie, so the browser needs no OIDC library and no token
# handling of its own. The frontend is served from this same origin in production, which
# is what makes a cookie the right carrier.
%prod.quarkus.oidc.application-type=web-app
%prod.quarkus.oidc.roles.role-claim-path=${KEYDRA_OIDC_ROLES_CLAIM:realm_access/roles}

# --- Scheduled work -----------------------------------------------------------
# Ordinary five-field crontab syntax, because the schedules Keydra takes over are the ones
# already living in somebody's crontab and the point is that they can be pasted across.
# Quarkus defaults to Quartz's dialect instead, which needs a seconds field and a literal
# '?' in either day-of-month or day-of-week — correct, unfamiliar, and rejected by nothing
# until the first save.
quarkus.scheduler.cron-type=unix

# Keydra's jobs are registered programmatically from rows, so there is not a single
# @Scheduled method in the application — and Quarkus' default is to leave the scheduler
# unstarted when it finds none. Everything then fails at the first save with "Scheduler was
# not started", which reads like a misconfiguration rather than the default it is.
quarkus.scheduler.start-mode=forced

# --- More than one Keydra ----------------------------------------------------
#
# The work that must happen once — schedules firing, alert rules being decided, the sweep
# that tidies up after a crash — is done by whichever instance holds a lease in the database
# every instance shares. A single instance simply always holds it and pays one small write
# every few seconds for the privilege.
#
# How long a lease is good for. Renewed three times as often, so two renewals have to be
# missed before it is lost; the cost of losing it is a schedule that runs seconds late, and
# the cost of a long one is how long the chores go undone after an instance is killed.
keydra.cluster.lease-seconds=${KEYDRA_LEASE_SECONDS:15}
# How often the rows behind the schedules and the alert rules are re-read. Only what changed
# is acted on. This is how an instance learns about a schedule somebody wrote on another one,
# so it is also the longest a new schedule can sit there doing nothing.
keydra.cluster.reconcile-seconds=${KEYDRA_RECONCILE_SECONDS:30}
# What this instance calls itself. A pod or host name where the platform provides one; the
# deployment can name it instead, and must when two instances share a hostname.
keydra.cluster.instance-id=${KEYDRA_INSTANCE_ID:}
# Tests hand the lease back and forth on purpose, and waiting fifteen seconds for a handover
# in a test is fifteen seconds of nothing happening.
%test.keydra.cluster.lease-seconds=3
%test.keydra.cluster.reconcile-seconds=5

# How long a rule's baseline is kept before it is worked out again. A baseline is a fact
# about an earlier window — last hour, yesterday, last week — so re-reading it on every
# reading would be a query per rule every five seconds for a number that does not move.
keydra.alerts.baseline-refresh=5m
# Tests write a rule and expect the next reading to be measured against it.
%test.keydra.alerts.baseline-refresh=1s

# --- What Keydra says about itself -------------------------------------------
#
# Metrics on the endpoint every Quarkus application has, in the format the estates this gets
# deployed into already scrape. Nothing here is a secret — counts, durations and outcomes,
# labelled by target id and never by target name — but it is not for strangers either, so the
# path is one an ingress can leave unpublished rather than one it has to.
quarkus.micrometer.export.prometheus.path=/q/metrics

# --- Where /q lives in a packaged run ----------------------------------------
#
# On its own port in production, and on the application's port everywhere else.
#
# What is under /q answers without a session, which is what a scraper and a scheduler need and
# is deliberate. It is also a description of the installation: which instances are running,
# how many targets, how many commands, how much work is moving. Phase 39 decided that a map of
# the installation is worth `instance:read`; leaving these on the same port as the interface
# hands a smaller one to anybody who can reach it, and "put a proxy in front and do not
# publish /q" is a rule somebody has to remember rather than a thing that is true.
#
# A separate port makes it true. The proxy publishes 8181 and there is nothing under /q on it;
# a scraper and the platform's probes reach 9001 inside the network, where they already are.
#
# Only in production. In development /q on the same port is one less thing to remember, and
# 9001 would collide with nothing while 9000 is the frontend's.
%prod.quarkus.management.enabled=true
%prod.quarkus.management.port=9001
%prod.quarkus.management.host=0.0.0.0
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.vertx.enabled=true
# The scrape itself must not appear in the request metrics: a graph of "requests per second"
# that counts the thing drawing it is a graph of the scrape interval.
quarkus.micrometer.binder.http-server.ignore-patterns=/q/.*

# Traces go nowhere until an endpoint is named, and naming one is what turns them on —
# see io.keydra.telemetry.config.TracesFollowTheEndpoint for why that is one setting rather
# than two. A tracing SDK pointed at nothing writes an export failure to the log every few
# seconds, which is worse than no tracing.
quarkus.otel.sdk.disabled=true
quarkus.otel.exporter.otlp.endpoint=${KEYDRA_OTLP_ENDPOINT:}
quarkus.otel.service.name=keydra
# Log records go the same way as the spans, and that is the point: a record exported over
# OTLP carries the trace it was written inside, so "why was this request slow" and "what did
# it say" are one question rather than two joined by a regular expression over a log line.
quarkus.otel.logs.enabled=true
# A line per request, which is what makes a trace have logs at all: Keydra deliberately says
# very little while serving one, so without this a span's log query answers nothing. The line
# is written inside the request, so it carries the trace it belongs to.
quarkus.http.access-log.enabled=${KEYDRA_ACCESS_LOG:true}
# Except the scrape and the health checks. A log of something asking every five seconds
# whether the application is alive is not a log anybody reads.
quarkus.http.access-log.exclude-pattern=/q/.*

# JSON on the console where a log shipper reads it, and the ordinary format in development,
# where a person does. The instance is on every line for the same reason it is on every
# metric: behind a load balancer, two processes answer the same question.
%prod.quarkus.log.console.json.enabled=${KEYDRA_JSON_LOGS:true}
%prod.quarkus.log.console.json.additional-field.instance.value=${KEYDRA_INSTANCE_ID:unnamed}
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Where a local backup destination writes. A path in a row is a path somebody can point at
# /etc, so the deployment names the root and a destination only names a directory inside it.
keydra.backup.local-root=${KEYDRA_BACKUP_DIR:backups}
# Tests write real files through the real component, so they write them somewhere that is not
# the source tree.
%test.keydra.backup.local-root=${java.io.tmpdir}/keydra-test-backups

# --- Readings that outlive the process ---------------------------------------
# Off unless a deployment asks for it. With this disabled the ring buffer is the only
# sink and Keydra behaves exactly as it did before there was a second one; with it on,
# the same readings are also written to ClickHouse over its HTTP interface and the
# dashboard can be asked for a window longer than the hour memory holds.
keydra.metrics.clickhouse.enabled=false
keydra.metrics.clickhouse.url=${KEYDRA_CLICKHOUSE_URL:http://localhost:8123}
keydra.metrics.clickhouse.username=${KEYDRA_CLICKHOUSE_USER:default}
keydra.metrics.clickhouse.password=${KEYDRA_CLICKHOUSE_PASSWORD:}
keydra.metrics.clickhouse.retention-days=30
# On in dev, where deploy/keydra-dev.yaml provides one. An instance that cannot reach it
# logs the failure and carries on with memory alone, which is the behaviour worth having
# in development as well as in production.
%dev.keydra.metrics.clickhouse.enabled=${KEYDRA_CLICKHOUSE_ENABLED:true}
%dev.keydra.metrics.clickhouse.url=http://localhost:8223
%prod.keydra.metrics.clickhouse.enabled=${KEYDRA_CLICKHOUSE_ENABLED:false}

# --- Schema ------------------------------------------------------------------
# The application speaks the reactive driver; Flyway speaks JDBC. Both point at the
# same database and only Flyway uses the JDBC one, which is why it is configured only
# where Flyway runs.
#
# Flyway runs in production and nowhere else. Dev keeps Hibernate's update, because a
# migration file per field would make iterating on a schema that has never shipped cost
# more than it protects; tests drop and create from the entities, which is what makes
# them a check on the entities rather than on the migrations. FlywaySchemaTest is what
# stops the two drifting: it migrates a database with Flyway and then asks Hibernate to
# validate the result.
%dev.quarkus.datasource.jdbc=false
%dev.quarkus.flyway.active=false
%test.quarkus.datasource.jdbc=false
%test.quarkus.flyway.active=false

%prod.quarkus.datasource.jdbc.url=jdbc:${KEYDRA_DB_URL:postgresql://localhost:5432/keydra}
%prod.quarkus.datasource.jdbc.max-size=2
%prod.quarkus.flyway.migrate-at-start=true

# --- Native image ------------------------------------------------------------
# The encryption key holder reads configuration in its static initialiser, and GraalVM
# runs static initialisers while building the image — where there is no configuration to
# read, and no key that should be baked into a binary even if there were. Deferring its
# initialisation to startup is both what makes the build work and what keeps the key out
# of the artifact.
# Two classes must be initialised at startup rather than while the image is built.
#
# EncryptedStringConverter.KeyHolder holds the key and the generator. Both are exactly
# what must not be baked into a binary: the key because a binary is not a secret store,
# and the generator because a seeded SecureRandom in the image heap means every copy of
# that binary produces the same initialisation vectors — which for AES-GCM is a break, not
# a weakness. The generator was a field on the converter until the native build found it;
# Hibernate instantiates converters at build time, so that is where it was being seeded.
#
# JceRandom is MINA SSHD's, with the same problem for the same reason.
quarkus.native.additional-build-args=\
  --initialize-at-run-time=io.keydra.connections.persistence.EncryptedStringConverter$KeyHolder\,\
  --initialize-at-run-time=org.apache.sshd.common.random.JceRandom\,\
  --initialize-at-run-time=org.apache.sshd.common.random.JceRandom$Cache

# --- Keydra's own store (phase 21) ------------------------------------------
# Where Keydra keeps what it has already worked out, and how one instance tells another
# that something changed. Unset means "in this process", which is the whole answer for a
# single Keydra: the caching still happens, it just does not leave the JVM.
#
# Set it, and several instances share both — which is what the notification hub needs
# before a key deleted on one of them reaches a browser attached to another.
#
# Deliberately not one of the targets. A cache living in a server somebody is browsing is
# a cache somebody empties with a bulk delete.
%dev.keydra.store.url=${KEYDRA_STORE_URL:redis://localhost:6481}
# How long a cached answer about who somebody is, or what they may do, is allowed to
# stand. Short, because it is only the safety net: anything that changes an account or a
# grant clears the cache outright, and this is what covers the change nobody heard about.
# Zero turns the caching off without removing the code path.
keydra.store.authz-ttl=30s

# --- The mail Keydra sends about itself (phase 22) ---------------------------
# Invitations, and password resets. Distinct from an alert delivery, which is a row somebody
# filled in per destination: this is the instance's own relay, configured once.
#
# With nothing set, an invitation is still created and its link comes back to the
# administrator who asked for it. An instance with no relay must not be an instance where
# nobody can be given an account.
#
# Resend is what this one uses: the host below, username "resend", and the API key as the
# password. The from address has to be on a domain Resend has verified.
keydra.mail.host=${KEYDRA_MAIL_HOST:}
keydra.mail.port=${KEYDRA_MAIL_PORT:587}
keydra.mail.tls=${KEYDRA_MAIL_TLS:true}
keydra.mail.username=${KEYDRA_MAIL_USERNAME:}
keydra.mail.password=${KEYDRA_MAIL_API_KEY:}
keydra.mail.from=${KEYDRA_MAIL_FROM:}
%dev.keydra.mail.host=${KEYDRA_MAIL_HOST:smtp.resend.com}
%dev.keydra.mail.username=${KEYDRA_MAIL_USERNAME:resend}
%dev.keydra.mail.from=${KEYDRA_MAIL_FROM:onboarding@resend.dev}

# What language a letter is written in when the account it is for has never said. An account that
# has used Keydra has a language preference and that answer wins; a brand-new one has expressed
# nothing, and there is nothing to infer it from — an address does not carry a language. So the
# honest default is what the installation is run in, and it is this one setting.
keydra.mail.language=${KEYDRA_MAIL_LANGUAGE:en}

# --- What the console refuses (phases 4 and 58) ------------------------------
# Both are optional and neither is set here, deliberately: an empty value is not the same as an
# absent one, and a written-out empty list would replace the built-in deny-list with nothing.
#
# keydra.console.denied-commands  replaces the built-in list outright.
# keydra.console.allowed-commands takes names out of it.
#
# Since phase 58 these are the floor rather than the whole answer. What they say applies to every
# target — which is what made them the wrong place to say "FLUSHDB is fine on the scratch server",
# because configuration cannot name a target and production is reached by the same instance. A
# profile now carries its own list, and it can only take names out of the half that is about the
# target: the commands refused because of what they would do to Keydra's own pooled connection are
# the same wherever the server is, and are not a target's to allow.

# --- The TiKV client's shaded Guava ------------------------------------------
# Loaded by the base class loader rather than once per Quarkus class loader.
#
# io.keydra.common.config.ShadedCollectionsFirst explains the bug: ImmutableList's own
# static initializer builds an iterator over the empty list it is halfway through creating,
# so whichever class in that shaded set is touched first decides whether the iterator reads a
# field that is still null. That precaution touches it early — but early in the class loader
# the config sources are discovered in, and Hibernate Validator's static-init recorder loads
# it again in another. A class initialised twice can lose the race the second time, which is
# what a pinned test order finally made reproducible: the first test class alphabetically
# failed to boot and took 283 tests with it.
#
# Parent-first means one class loader, one initialisation, and the precaution above lands in
# the same place the recorder will look. Safe for this artifact because nothing here reloads
# it: the TiKV engine holds no state a dev-mode restart needs to drop.
quarkus.class-loading.parent-first-artifacts=org.tikv:tikv-client-java

# --- Hearing what a target says about its own changes (phase 57) -------------
# How long a lease on a keyspace watch is good for. A browser can vanish — a closed laptop, a lost
# network — so a watch belongs to a lease that is renewed while somebody is looking rather than to a
# page that may never say goodbye. Long enough that a tab throttled in the background does not lose
# its watch; short enough that a target nobody is browsing stops being subscribed to.
keydra.keyspace.lease=${KEYDRA_KEYSPACE_LEASE:2m}

# How often what has piled up is sent out. One message per mutation would be a broadcast per write
# on a server doing thousands a second, to every tab watching it. Lower means a list that catches up
# sooner; higher means fewer messages for the same news.
keydra.keyspace.flush-interval=${KEYDRA_KEYSPACE_FLUSH_INTERVAL:2s}

# --- Asking what this installation reaches whether it is there (phase 49) ----
# Identity providers and backup destinations, on the instance holding the chores. Not on page load:
# ten people watching a status page would be ten times the outbound traffic of one, aimed at
# somebody else's service. Zero turns the checking off without removing the code path.
keydra.reachability.interval=${KEYDRA_REACHABILITY_INTERVAL:10m}

# How soon after an answer the button may ask again. A button that can be held down is a way to
# make Keydra hammer somebody else's service from a page that only needs instance:read.
keydra.reachability.minimum-gap=${KEYDRA_REACHABILITY_MIN_GAP:30s}

# How long the record of a change is kept (phase 62).
#
# Changes rather than answers, so this is a handful of rows a year for something that works — the
# window can be generous because the thing being kept is evidence, and evidence is worth more the
# older it is. Not forever: a history nobody prunes grows for as long as the application runs, and
# what happened three years ago to a destination that has been replaced twice is not evidence of
# anything.
keydra.reachability.history-kept=${KEYDRA_REACHABILITY_HISTORY:90d}

# Off on the clock in tests: a walk that fired behind a test would rewrite the rows the test is
# asserting on, and every test that wants one drives it directly.
%test.keydra.reachability.interval=0

# How long an invitation or a reset link is good for. A link that works forever is a password
# with extra steps.
keydra.invitations.valid-for=${KEYDRA_INVITATION_VALID_FOR:P7D}

# --- The GraphQL surface (phase 23) -----------------------------------------
# Beside the REST one, for the questions REST answers badly: a table showing six columns of
# a long list asks for six columns instead of being sent every field of every row.
#
# A schema that can be asked anything is a schema that can be asked something expensive, so
# the limits below are set rather than left at their defaults. They are not tuning knobs —
# each one closes a documented way of turning one request into a lot of work.

# How deep a query may nest. Keydra's graph is shallow by construction — a migration names
# two connections and nothing nests below those — so anything approaching this is either a
# mistake or somebody looking for a cycle to ride.
quarkus.smallrye-graphql.instrumentation-query-depth=7

# How many fields one query may ask for in total. This is the limit that catches the attack
# depth alone does not: a query one level deep that names the same field five hundred times
# under five hundred aliases.
quarkus.smallrye-graphql.instrumentation-query-complexity=250

# The parser's own limits, lowered from defaults meant for public APIs with large documents.
# A query Keydra has any use for is a few hundred tokens.
quarkus.smallrye-graphql.parser-max-tokens=2000
quarkus.smallrye-graphql.parser-max-whitespace-tokens=4000

# GET is off, which is the default and worth being explicit about: a query in a URL is a
# query in a proxy log, a browser history and a referrer header, and Keydra's queries name
# connection ids and key patterns. Everything goes by POST with a body.
quarkus.smallrye-graphql.http.get.enabled=false
quarkus.smallrye-graphql.http.post.queryparameters.enabled=false

# What an unexpected failure says. The default is a generic sentence and it stays that way:
# an exception message from inside the application is a description of the application, and
# the log is where that belongs. Domain refusals are their own types and say what they mean.
quarkus.smallrye-graphql.default-error-message=Keydra could not answer that

# The ones that are told plainly, and it is not a leak to tell any of them. "You are not signed in"
# and "you may not do that" are answers a caller needs to act on — the first one is how the
# browser knows to put the login page back when a session has expired, and masking it turns an
# expired session into a page that quietly stops working.
#
# The last three are the same case in a different domain. "Send the target's name", "this has
# been recorded and needs somebody else to agree" and "you cannot answer your own request" are
# the entire content of those refusals: masked, they arrive on the GraphQL surface as "Keydra
# could not answer that", which is a guard doing its work and throwing away the sentence that
# says how to get past it.
quarkus.smallrye-graphql.show-runtime-exception-message=io.quarkus.security.UnauthorizedException,\
  io.quarkus.security.ForbiddenException,\
  io.quarkus.security.AuthenticationFailedException,\
  io.keydra.authz.exception.PermissionDeniedException,\
  io.keydra.authz.exception.PublicUrlNotConfiguredException,\
  io.keydra.authz.exception.TooManyAttemptsException,\
  io.keydra.connections.exception.TargetNotNamedException,\
  io.keydra.approvals.exception.ApprovalRequiredException,\
  io.keydra.approvals.exception.ApprovalRefusedException
# The one extension an answer carries, and it is deliberately the only one.
#
# Every answer on this surface is 200, so a caller cannot tell one refusal from another by its
# status — and telling them apart by wording is one translation away from breaking. The code is
# how the browser knows that "recorded, and waiting for somebody to agree" is not a failure.
#
# `exception` and `classification` are left off rather than forgotten: an exception's class name
# is a description of the application, which is the same thing default-error-message above exists
# to keep out of an answer.
quarkus.smallrye-graphql.error-extension-fields=code

quarkus.smallrye-graphql.print-data-fetcher-exception=false
%dev.quarkus.smallrye-graphql.print-data-fetcher-exception=true

# Introspection and the schema document: on where somebody is building against it, off in
# production. Neither is a vulnerability by itself — an authenticated caller can only reach
# what they may reach either way — but a schema is a map of every field and argument, and a
# production deployment has nobody who needs the map and no way to know who is reading it.
%dev.quarkus.smallrye-graphql.schema-available=true
%test.quarkus.smallrye-graphql.schema-available=true
quarkus.smallrye-graphql.schema-available=false
# Closed in every profile, and opened again by the two that need it. Written this way
# round because a property that only closes the door in %prod leaves it open on any
# instance started with the wrong profile — and the wrong profile is a mistake somebody
# makes, where naming the production one is a thing they have to get right.
quarkus.smallrye-graphql.field-visibility=no-introspection
%dev.quarkus.smallrye-graphql.field-visibility=default
%test.quarkus.smallrye-graphql.field-visibility=default

# The editor, in development only.
%dev.quarkus.smallrye-graphql.ui.enabled=true
quarkus.smallrye-graphql.ui.enabled=false

# --- Sessions (phase 24) ----------------------------------------------------
# How often lapsed sessions are removed. Nothing reads an expired row — the identity behind
# it stopped working at the expiry, and the list a person reads shows only what is live — so
# keeping them is keeping a record of somebody's movements for its own sake.
keydra.sessions.sweep-interval=${KEYDRA_SESSION_SWEEP_INTERVAL:1h}

%dev.quarkus.live-reload.instrumentation=true

# --- Migration scripting -----------------------------------------------------
#
# Whether a migration may carry a Lua script that decides what happens to each key.
#
# Off by default, and that is the interesting part. Everything else Keydra does runs against
# somebody's Redis; a script runs inside Keydra, in the process that holds every target's
# credentials and can reach every network this host can. io.keydra.keys.script.SafeLua takes the
# doors out of the interpreter and bounds how long a script may run, and the permission to use one
# is on the instance rather than on a target for the same reason — but a deployment that has no use
# for scripts should be able to say so once rather than trust a permission never to be granted by
# mistake. Turning it off refuses the request outright, whoever is asking.
keydra.keys.scripting.enabled=${KEYDRA_KEY_SCRIPTING:false}

# --- Approvals (phase 60) ----------------------------------------------------
#
# How long an operation waits for a second person before it stops being answerable.
#
# A day. Long enough that a colleague in another timezone gets to see it, short enough that
# nobody agrees to a purge against a keyspace they last looked at three weeks ago — an
# approval is agreement to a state of the world rather than to a sentence, and the world moves.
#
# It expires rather than being deleted: the failure this prevents is somebody believing an
# operation is arranged when it is never going to happen, so the row stays and says so.
keydra.approvals.ttl=${KEYDRA_APPROVAL_TTL:24h}

# How often the instance holding the lease looks for requests whose time has run out. Five
# minutes is the resolution of "it expired", which is a granularity nobody waiting a day notices.
keydra.approvals.sweep-interval=${KEYDRA_APPROVAL_SWEEP_INTERVAL:5m}
